<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>Joseph Smith — Palmyra Quest</title>
  <link rel="stylesheet" href="css/style.css?v=3" />
  <script>
    (function () {
      var touch =
        (navigator.maxTouchPoints > 0) ||
        ('ontouchstart' in window) ||
        (window.matchMedia && (
          matchMedia('(max-width:900px)').matches ||
          matchMedia('(pointer:coarse)').matches ||
          matchMedia('(hover:none)').matches
        ));
      if (!touch) return;
      document.documentElement.classList.add('touch-ui');
      if (document.body) document.body.classList.add('touch-ui');
      else document.addEventListener('DOMContentLoaded', function () {
        document.body.classList.add('touch-ui');
      });
    })();
  </script>
</head>
<body>
  <div id="game-wrap">
    <canvas id="game" width="256" height="240" aria-label="Joseph Smith Palmyra Quest"></canvas>

    <div id="touch-controls" aria-hidden="true">
      <button type="button" class="touch-btn touch-start" data-action="start" aria-label="Start">START</button>
      <div class="touch-bar">
        <div class="touch-cluster touch-move" aria-label="Move">
          <button type="button" class="touch-btn" data-action="left" aria-label="Left">◀</button>
          <button type="button" class="touch-btn" data-action="right" aria-label="Right">▶</button>
        </div>
        <div class="touch-cluster touch-actions" aria-label="Actions">
          <button type="button" class="touch-btn touch-jump" data-action="up" aria-label="Jump">A</button>
          <button type="button" class="touch-btn touch-attack" data-action="attack" aria-label="Attack">B</button>
        </div>
      </div>
    </div>

    <p id="hint">Arrows / WASD move · Space / Z attack · Enter start · On phones: on-screen buttons</p>
  </div>
  <script type="module" src="js/main.js?v=3"></script>
</body>
</html>
