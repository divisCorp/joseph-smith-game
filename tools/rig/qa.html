<!doctype html>
<html><head><meta charset="utf-8"><title>Rig QA renderer</title></head>
<body style="margin:0;background:#222">
<canvas id="c"></canvas>
<script type="module">
import { loadRig } from '../../js/rig.js?v=73';
import { oldState, newState, drawOld, drawNew, soleContacts, ANIMS } from '../../js/rig-demo.js?v=73';
const sheet = await new Promise((r) => { const i = new Image(); i.onload = () => r(i); i.src = '../../assets/joseph.png'; });
const rig = await loadRig('../../assets/rig/');
window.rig = rig;
window.ANIMS = ANIMS;
/** Render a comparison strip: row 0 old, row 1 new, row 2 new+bones (optional). */
window.renderStrip = (anim, times, { scale = 3, bones = true, rows = null, camY = 0, lift = 0, labels = true, cellW = 64 } = {}) => {
  const c = document.getElementById('c');
  const cw = cellW * scale, ch = (128 + lift) * scale;
  const R = rows || (bones ? ['old', 'new', 'bones'] : ['old', 'new']);
  c.width = cw * times.length; c.height = ch * R.length;
  const g = c.getContext('2d');
  R.forEach((row, ri) => {
    times.forEach((t, i) => {
      const x = i * cw, y = ri * ch;
      g.fillStyle = (i + ri) % 2 ? '#d9e6d2' : '#cfdec7';
      g.fillRect(x, y, cw, ch);
      const gy = y + ch - 0.5 * scale;
      g.fillStyle = '#6b5a3a';
      g.fillRect(x, gy, cw, scale);
      const oy = y + lift * scale;
      const cx = x + ((cellW - 64) / 2) * scale;
      if (row === 'old') drawOld(g, sheet, oldState(anim, t), cx, oy, scale);
      else drawNew(g, rig, newState(anim, t).pose, cx, oy, scale, { bones: row === 'bones' });
      if (labels) {
        g.fillStyle = 'rgba(0,0,0,.65)'; g.font = `${4 * scale}px sans-serif`;
        g.fillText(`${row} ${t.toFixed(2)}s`, x + 2 * scale, y + 6 * scale);
      }
    });
  });
  return c.toDataURL('image/png');
};
/** Foot slide report: world-space x drift of each grounded heel/toe between frames. */
window.slideReport = (anim, dur, step = 1 / 240) => {
  const drift = { n: [], f: [] };
  let prev = null;
  for (let t = 0; t <= dur + 1e-9; t += step) {
    const { pose, dist } = newState(anim, t);
    const sc = soleContacts(rig.meta, pose);
    if (prev) {
      for (const s of ['n', 'f']) for (const k of ['heel', 'toe']) {
        if (sc[s][k][1] >= 125.6 && prev.sc[s][k][1] >= 125.6) drift[s].push(Math.abs(sc[s][k][0] + dist - (prev.sc[s][k][0] + prev.dist)));
      }
    }
    prev = { sc, dist };
  }
  const stat = (a) => ({ groundedSamples: a.length, maxStepPx: +Math.max(0, ...a).toFixed(4), meanStepPx: +(a.reduce((x, y) => x + y, 0) / Math.max(1, a.length)).toFixed(4) });
  return { near: stat(drift.n), far: stat(drift.f) };
};
window.ready = true;
</script>
</body></html>
